[Setting]
	#Screens whose sorter buttons are hidden (toggle with the disable-buttons key). Entries are "screenId" = screen class + "@" + title translation key.
	specialList = ["container.farmersdelight.monster_pot", "net.minecraft.client.gui.screens.inventory.MerchantScreen@entity.minecraft.villager.ae2.fluix_researcher"]
	#name, mod, count, tags
	SortBy = "count"
	#Only valid for containers with more than 10 slots if true.
	Filter1 = true
	#Only valid for containers without invalid slot such as recipe result slot if true.
	Filter2 = true
	#是否启用默认拼音排序。
	pinyin = true
	#Per-screen button offsets: screenId (screen class + "@" + title key)|sort X|sort Y|transfer X|transfer Y.
	buttonPositions = []
	#When transferring container items into the player inventory, fill the 27-slot main inventory before the 9-slot hotbar (true, like Sophisticated Core) or the hotbar first (false, like vanilla quick-move).
	transferMainInventoryFirst = true
