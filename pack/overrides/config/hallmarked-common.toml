[Reforging]
	#If true, equipment gets one chance to roll a quality the first time it enters a player's inventory.
	AutoReforge = true
	#Chance for that one-time roll to apply a quality.
	# Default: 0.5
	# Range: 0.1 ~ 1.0
	AutoReforgeChance = 0.5

[Grading]
	#If true, found gear of grades marked "appraise" (Masterwork, Gearwrought, Unique by default) arrives
	#Unappraised: affixes hidden and dormant until struck at an Assay Anvil.
	#If false, nothing new is sealed, and Unappraised items a player carries are revealed automatically.
	#Overrides the per-grade "appraise" flag without a datapack edit.
	Appraisal = false
	#If true, equipment is given a grade of work (Shoddy .. Gearwrought) with rolled affixes.
	#Loot rolls on generation; everything else rolls the first time it enters a player's inventory.
	#Grade odds and affix counts live in data/<namespace>/grades/*.json.
	Enabled = true
	#How strongly the Luck attribute shifts grade odds. Each grade's weight is multiplied by
	#(1 + luck * LuckFactor * luck_scaling); luck_scaling is set per grade (negative for Shoddy).
	# Default: 0.15
	# Range: 0.0 ~ 10.0
	LuckFactor = 0.15
	#If true, equipment mobs spawn with is graded (and may get a quality) when they enter the world,
	#using the grades' "mob" weights. Mobs fight with those stats, and drop graded gear.
	MobEquipment = true
	#If true, gear from loot tables (chests, mob and block drops, archaeology, vaults) is graded as found loot,
	#after every other loot modifier has run, including Iron's, LootJS scripts and other mods' additions.
	#If false, loot is only graded by hallmarked:grade_loot modifiers a datapack adds, and the rest on pickup (as crafted).
	LootTables = true
	#Loot tables never graded or given set pieces. A trailing * matches a prefix, e.g. "somemod:chests/*".
	#Gear from them is graded on pickup as crafted instead.
	ExcludedLootTables = []

[Procs]
	#Master switch for affix procs (bleed, stagger, leech, ignite, cleave, reprisal, reaper, anima).
	#Procs that need another mod only exist when that mod is installed.
	Enabled = true
	#If true, mobs wearing graded gear trigger its procs too.
	MobsUseProcs = true

[Balance]
	#Upper cap for the hallmarked:damage_resistance reduction (0.8 = at most 80% less damage).
	# Default: 0.8
	# Range: 0.0 ~ 0.95
	MaxDamageResistance = 0.8

[Sets]
	#Chance that a set piece dropping for a player (chests, parcels) is a missing piece of a set
	#they have already started, instead of a random piece.
	# Default: 0.6
	# Range: 0.0 ~ 1.0
	SmartDropChance = 0.6
	#Set pieces traded in for one Mountebank's Token (sneak + right-click a Mountebank's Coffer holding one).
	# Default: 1
	# Range: 1 ~ 64
	TradeInPieces = 1
